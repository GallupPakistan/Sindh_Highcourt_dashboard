name: Update Sindh Cause List
on:
  schedule:
    # PKT is UTC+5, no DST. Monday-Friday only (courts are closed on weekends).
    # Times are shifted off the top of the hour to avoid GitHub's high-traffic
    # exact-hour queue, where scheduled runs can be silently skipped.
    - cron: "7 4 * * 1-5"    # ~09:07 AM PKT
    - cron: "13 7 * * 1-5"   # ~12:13 PM PKT
    - cron: "22 10 * * 1-5"  # ~03:22 PM PKT
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab for testing
permissions:
  contents: write   # required so the workflow can commit and push the new Excel file
  issues: write     # required so the workflow can open a tracking issue on failure
jobs:
  update-causelist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install openpyxl PyMuPDF requests
      - name: Run cause list downloader & parser
        run: python sindh_causelist_auto.py cause_lists
      - name: Commit and push new data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cause_lists/
          if git diff --cached --quiet; then
            echo "No new data to commit today."
          else
            git commit -m "Auto-update: cause list data for $(date +'%d %B %Y')"
            git push
          fi
      - name: Open tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Cause list update failed - ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled run "${context.workflow}" failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check whether the day's PDF needs to be uploaded manually.`,
              labels: ["automation-failure"]
            })
