name: Update Sindh Cause List

on:
  schedule:
    # PKT is UTC+5, no DST. Monday–Friday only (courts are closed on weekends).
    # Runs 3 times a day so that if the cause list PDF isn't uploaded yet at
    # the first attempt, later runs will pick it up automatically.
    - cron: "0 4 * * 1-5"    # 09:00 AM PKT
    - cron: "0 7 * * 1-5"    # 12:00 PM PKT
    - cron: "0 10 * * 1-5"   # 03:00 PM PKT
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab for testing

permissions:
  contents: write   # required so the workflow can commit and push the new Excel file

jobs:
  update-causelist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl PyMuPDF requests

      - name: Run cause list downloader & parser
        run: python sindh_causelist_auto.py cause_lists

      - name: Commit and push new data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cause_lists/
          if git diff --cached --quiet; then
            echo "No new data to commit today."
          else
            git commit -m "Auto-update: cause list data for $(date +'%d %B %Y')"
            git push
          fi
