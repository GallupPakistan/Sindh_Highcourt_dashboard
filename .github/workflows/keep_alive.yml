name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "3 */10 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        continue-on-error: true
        run: |
          echo "Pinging Sindh_HC..."
          response=$(curl -s -L --max-redirs 10 -o /dev/null -w "%{http_code}" "https://sindhhighcourtdashboard-ajle3yesxgwegsp9tdtykw.streamlit.app" || echo "curl_failed")
          echo "HTTP response code: $response"
          if [ "$response" == "200" ]; then
            echo "App is awake and responding correctly."
          else
            echo "Note: got response '$response' — may still be fine on cold start."
          fi
